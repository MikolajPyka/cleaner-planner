<!doctype html>
<html lang="pl" mode="md">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4C6B57" />
<title>Cleaner Planner</title>

<!-- Ionic (web components) — framework UI pod aplikacje mobilne, używany bez frameworka JS.
     Wersje spięte na stałe (7.8.6 / 7.4.0). Wymaga połączenia z internetem przy uruchomieniu —
     instrukcja pełnego, lokalnego (offline) wdrożenia dla Fazy 3 jest w README.md. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@7.8.6/css/ionic.bundle.css" />
<script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@7.8.6/dist/ionic/ionic.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@7.8.6/dist/ionic/ionic.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- Google Identity Services — prawdziwe logowanie Google (patrz js/google-auth.js).
     Bez własnego backendu: appka woła Google wprost z przeglądarki. Jeśli Client ID
     w google-auth.js nie jest wypełniony, przycisk logowania pokazuje uczciwy
     komunikat zamiast próbować się łączyć. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<ion-app>

  <ion-content id="mainContent" scroll-y="true">
    <!-- Widoki renderowane dynamicznie przez app.js (Logowanie / Start / Kalendarz /
         Obowiązki / Kategorie / Konto) -->
  </ion-content>

  <!-- Dolny pasek nawigacji -- własny komponent (nie ion-tab-bar), żeby dokładnie
       odtworzyć wygląd ze statycznego podglądu (pigułka aktywnej zakładki itd.).
       Ukrywany na ekranie logowania i widokach "pushed" (Kategorie/Konto). -->
  <div id="tabbar" class="tabbar" aria-label="Nawigacja główna">
    <button type="button" class="tabbar-btn" data-tab="dashboard" aria-label="Start"></button>
    <button type="button" class="tabbar-btn" data-tab="month" aria-label="Kalendarz"></button>
    <button type="button" class="tabbar-btn" data-tab="chores" aria-label="Obowiązki"></button>
  </div>

</ion-app>

<div id="modalRoot"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
